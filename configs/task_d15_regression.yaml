task_name: d15_regression
run_name: d15_regression
dimension: 15_audio_quality_control
inputs:
  - id: t2va
    root: ./data/固定回归case/15_audio_quality_control/t2va
    mode: t2va
    prompt_filename: prompt_final.txt
    video_filename: video.mp4
    case_ids: []
  - id: f2va
    root: ./data/固定回归case/15_audio_quality_control/f2va
    mode: f2va
    prompt_filename: prompt_final.txt
    video_filename: video.mp4
    case_ids: []
    references:
      first_frame_filename: input_01
  - id: r2va
    root: ./data/固定回归case/15_audio_quality_control/r2va
    mode: r2va
    prompt_filename: prompt_final.txt
    video_filename: video.mp4
    case_ids: []
    references:
      image_pattern: input_{index:02d}
      video_pattern: ref_video_{index:02d}
      audio_pattern: ref_audio_{index:02d}
evaluation:
  subpoints:
    voice_naturalness: {components: {dnsmos_ovr: true}}
    timbre_consistency: {components: {ecapa_same_speaker: true}}
    emotion_control: {components: {emotion2vec_match: true}}
    ambient_sound: {components: {clap_ambient: true}}
    action_sfx: {components: {clap_sfx: true}}
stages: [check, checklist, evaluate, score]
output_dir: ./outputs/d15_regression
